name: AI Model Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Run AI Validation Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---------------------------------------------------------------
      # Mock mode — always runs, no API key needed
      # real_api tests are auto-skipped by conftest when key is absent
      # ---------------------------------------------------------------
      - name: Run tests (mock mode)
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_performance.py \
            -m "not slow"
        env:
          ANTHROPIC_API_KEY: ""

      # ---------------------------------------------------------------
      # Real Claude API — runs every time; tests self-skip when key absent
      # Add ANTHROPIC_API_KEY to repo secrets to activate these tests
      # ---------------------------------------------------------------
      - name: Run real-API + LLM-judge tests
        run: |
          pytest tests/ -v --tb=short -m "real_api"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ---------------------------------------------------------------
      # Performance benchmarks
      # ---------------------------------------------------------------
      - name: Run performance benchmarks
        run: |
          pytest tests/test_performance.py -v \
            --benchmark-only \
            --benchmark-json=benchmark-results.json
        env:
          ANTHROPIC_API_KEY: ""

      # ---------------------------------------------------------------
      # Upload artefacts
      # ---------------------------------------------------------------
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: benchmark-results.json
          retention-days: 30
